<style>
/* Layout: one 16:9 film stage, transport controls, then size and colorway pickers underneath. */
:root {
  --bg: #F5F0E7;
  --surface: #FFFBF4;
  --ink: #26332A;
  --muted: #6E6A5E;
  --gold: #A97C25;
  --line: #E1D7C4;
  --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-ui: "Montserrat", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171A16; --surface: #20241F; --ink: #EDE6D8; --muted: #A49F90; --gold: #D6AA55; --line: #343A31;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171A16; --surface: #20241F; --ink: #EDE6D8; --muted: #A49F90; --gold: #D6AA55; --line: #343A31;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); padding: 24px 16px 40px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }
header { display: grid; gap: 4px; }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 3.4vw, 2.4rem); margin: 0; line-height: 1.1; text-wrap: balance; }
.sub { color: var(--muted); font-size: 0.92rem; max-width: 62ch; margin: 0; line-height: 1.5; }
.stage { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #EFE6D7; box-shadow: 0 18px 50px -24px rgba(40, 30, 10, 0.45); }
.stage svg { display: block; width: 100%; height: 100%; }
.transport { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
button { font: 600 0.85rem var(--font-ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 9px 18px; cursor: pointer; }
button:hover { border-color: var(--gold); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#scrub { flex: 1 1 220px; min-width: 0; accent-color: var(--gold); }
#clock { font-variant-numeric: tabular-nums; font-size: 0.85rem; color: var(--muted); min-width: 92px; text-align: right; }
.pickers { display: flex; flex-wrap: wrap; gap: 20px 40px; align-items: flex-start; }
.picker { display: grid; gap: 10px; min-width: 0; }
.picker .label { font-size: 0.8rem; color: var(--muted); }
.picker .label b { color: var(--ink); }
.sizes { display: flex; gap: 8px; flex-wrap: wrap; }
.size[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.size small { font-weight: 500; opacity: .75; margin-left: 6px; font-variant-numeric: tabular-nums; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 2px solid var(--line); background: var(--c); }
.sw[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--gold); }
/* capture mode for frame-by-frame video export */
body.capture { padding: 0; margin: 0; background: #000; }
body.capture .wrap { max-width: none; display: block; }
body.capture header, body.capture .transport, body.capture .pickers { display: none; }
body.capture .stage { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; }
/* embed mode: just the film, controlled by the host page */
body.embed { padding: 0; margin: 0; background: transparent; }
body.embed .wrap { max-width: none; display: block; }
body.embed header, body.embed .transport, body.embed .pickers { display: none; }
body.embed .stage { border-radius: 0; box-shadow: none; }
.stage.vertical { aspect-ratio: 9 / 16; max-width: min(100%, 440px); margin-inline: auto; }
body.embed .stage.vertical { max-width: 100%; }
body.capture .stage.vertical { width: 1080px; height: 1920px; max-width: none; }
@media (prefers-reduced-motion: reduce) { .stage { box-shadow: none; } }
</style>

      for (let i = 0; i <= N; i++) top.push(at(i / N, 0));
      for (let i = 0; i <= N; i++) top.push(at(1, i / N));
      for (let i = N; i >= 0; i--) top.push(at(i / N, 1));
      for (let i = N; i >= 0; i--) top.push(at(0, i / N));
      for (let i = 0; i <= N; i++) drape.push(at(i / N, 1));
      for (let i = 0; i <= 8; i++) drape.push(at(1, 1 + .5 * i / 8));
      for (let i = N; i >= 0; i--) drape.push(at(i / N, 1.5));
      for (let i = 8; i >= 0; i--) drape.push(at(0, 1 + .5 * i / 8));
      set('flatTop', { d: poly(top) }); set('flatSheen', { d: poly(top) });
      set('flatDrape', { d: poly(drape) }); set('flatDrapeShade', { d: poly(drape), opacity: se.toFixed(3) });

      const fold = eback(seg(t, 16.9, 18.7)), f = .2 * fold;
      if (fold > 0) {
        const band = [], hem = [], st = [];
        for (let i = 0; i <= N; i++) band.push(bedTop(i / N, 0));
        for (let i = N; i >= 0; i--) { const p = bedTop(i / N, f); band.push([p[0], p[1] + Math.sin(i / N * Math.PI) * 3]); }
        for (let i = 0; i <= N; i++) { const p = bedTop(i / N, f); hem.push([p[0], p[1] + Math.sin(i / N * Math.PI) * 3]); st.push(bedTop(i / N, Math.max(0, f - .045))); }
        set('flatBand', { d: poly(band) });
        set('flatHem', { d: 'M' + hem.map(P).join(' L') });
        set('flatStitch', { d: 'M' + st.map(P).join(' L'), opacity: seg(t, 18.2, 18.7).toFixed(2) });
      } else { set('flatBand', { d: '' }); set('flatHem', { d: '' }); set('flatStitch', { d: '' }); }

      const fl = bedDrape(0, 0), fr = bedDrape(1, 0), bl = bedDrape(0, 1), br = bedDrape(1, 1);
      set('hospL', { d: `M${P(fl)} L${P([fl[0] + 70 * tuck, bl[1]])}` });
      set('hospR', { d: `M${P(fr)} L${P([fr[0] - 70 * tuck, br[1]])}` });
      set('hospital', { opacity: (tuck * .85).toFixed(3) });
    }

    // --- Cool Comfort pillow bags slide in, pillows pop out ---
    const bagIn = eo(seg(t, 20.4, 21.0)), bagOut = eio(seg(t, 22.0, 22.7));
    const bagX = pkgHome[0] + 20 + (1 - bagIn) * 620 + bagOut * 620;
    const bagOp = t < 20.4 || t > 22.7 ? 0 : 1;
    const burst = Math.sin(seg(t, 21.05, 21.35) * Math.PI);
    const BAGS = [['duffelLow', bagX, 905 - 82, 1], ['duffelHigh', bagX + 14, 905 - 82 - 150, -1]];
    BAGS.forEach(([id, x, y, s]) => {
      const sq = 1 + burst * .06;
      set(id, { transform: `translate(${x.toFixed(1)} ${y}) rotate(${(s * burst * 3).toFixed(2)}) scale(${(.82 * sq).toFixed(3)} ${(.82 / sq).toFixed(3)})`, opacity: bagOp });
    });

    // --- pillows fly from the bags, cases slide on ---
    [['pillowL', 0, 21.15, 'clipLr', 22.3, 1], ['pillowR', 1, 21.3, 'clipRr', 22.7, 0]].forEach(([id, side, t0, clip, c0, bagIdx]) => {
      const p = seg(t, t0, t0 + .95);
      const [, bx, by] = BAGS[bagIdx];
      const tx = G.pillowX[side], ty = 528;
      const f = eio(p);
      const x = lerp(bx, tx, f), y = lerp(by, ty, f) - Math.sin(f * Math.PI) * 260;
      const rot = (1 - eo(p)) * (side ? 200 : -200);
      const land = Math.sin(seg(t, t0 + .95, t0 + 1.3) * Math.PI);
      const pf = 1 + Math.sin(seg(t, c0 + 2.2, c0 + 2.7) * Math.PI) * .04;
      const sc = lerp(.55, .92, eo(p)) * pf;
      set(id, { transform: `translate(${x.toFixed(1)} ${(y + land * 6).toFixed(1)}) rotate(${rot.toFixed(2)}) scale(${(sc * S.pillow * (1 + land * .05)).toFixed(3)} ${(sc * (1 - land * .07)).toFixed(3)})`, opacity: p > 0 ? 1 : 0 });
      set(clip, { width: (eio(seg(t, c0, c0 + 2.2)) * 360).toFixed(1) });
    });

    // --- sparkles ---
    SPARK.forEach(s => {
      const p = seg(t, s.t0, s.t0 + .9), sc = Math.sin(p * Math.PI);
      const [x, y] = topPt(s.u, s.v);
      set(s.n, { opacity: (sc * .95).toFixed(3), transform: `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(p * 90).toFixed(1)}) scale(${(sc * .9).toFixed(3)})` });
    });

    // --- captions + chips ---
    CAPS.forEach(c => {
      set(c.g, { opacity: win(t, c.a, c.b, .4).toFixed(3), transform: `translate(0 ${((1 - eo(seg(t, c.a, c.a + .6))) * 26).toFixed(1)})` });
    });
    const V = format === 'vertical';
    CHIPS.forEach(c => {
      const o = win(t, c.a, c.b, .3);
      const slide = (1 - eo(seg(t, c.a, c.a + .45))) * (c.side === 'L' ? -40 : 40);
      set(c.g, { opacity: o.toFixed(3), transform: V ? `translate(0 ${Math.abs(slide).toFixed(1)})` : `translate(${slide.toFixed(1)} 0)` });
      if (o > 0) {
        const to = toCanvas(c.to);
        set(c.line, { d: 'M' + P(c.from) + ' L' + P(to) });
        set(c.end, { cx: to[0].toFixed(1), cy: to[1].toFixed(1) });
      }
    });

    // --- end card ---
    set('endBand', { opacity: eo(seg(t, 25.9, 26.5)).toFixed(3) });
    endSw.forEach((n, i) => {
      const p = eback(seg(t, 26.2 + i * .07, 26.6 + i * .07));
      n.setAttribute('r', (Math.max(0, p) * 19 * (i === ci ? 1.3 : 1)).toFixed(2));
    });
    const pc = seg(t, 26.0, 26.7);
    set('photoCard', { opacity: eo(pc).toFixed(3), transform: `translate(${V ? 540 : 1648} ${((V ? 690 : 752) + (1 - eo(pc)) * 60).toFixed(1)}) rotate(${lerp(4, -2.5, eback(pc)).toFixed(2)}) scale(${lerp(.85, 1, eback(pc)).toFixed(3)})` });
  }

  // ---------- player ----------
  let t = 0, playing = true, last = null;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const capture = /capture/.test(location.search);
  const playBtn = $('play'), scrub = $('scrub'), clock = $('clock');

  function show() {
    render(t);
    scrub.value = t.toFixed(2);
    clock.textContent = t.toFixed(1) + ' / 30.0s';
    playBtn.textContent = playing ? 'Pause' : (t >= DUR ? 'Play again' : 'Play');
  }
  function tick(now) {
    if (playing) {
      if (last !== null) t = Math.min(DUR, t + (now - last) / 1000);
      last = now;
      if (t >= DUR) { if (loop) t = 0; else { playing = false; tell('ended'); } }
      show();
    } else last = null;
    requestAnimationFrame(tick);
  }
  playBtn.addEventListener('click', () => { if (t >= DUR) t = 0; playing = !playing; last = null; show(); });
  $('restart').addEventListener('click', () => { t = 0; playing = true; last = null; show(); });
  scrub.addEventListener('input', () => { t = parseFloat(scrub.value); playing = false; show(); });

  const sizeWrap = $('sizes');
  Object.entries(SIZES).forEach(([name, S]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'size'; b.id = 'size-' + name.toLowerCase();
    b.innerHTML = `${name}<small>${S.w}" × ${S.l}"</small>`;
    b.setAttribute('aria-pressed', name === size);
    b.addEventListener('click', () => pickSize(name));
    sizeWrap.appendChild(b);
  });

  const swWrap = $('swatches');
  COLORS.forEach(([name, hex], i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw'; b.id = 'sw-' + i;
    b.style.setProperty('--c', hex);
    b.setAttribute('aria-label', name); b.title = name;
    b.setAttribute('aria-pressed', i === chosen);
    b.addEventListener('click', () => pickColor(i));
    swWrap.appendChild(b);
  });

  function pickColor(i) {
    if (i < 0) return;
    chosen = i; painted = null;
    swWrap.querySelectorAll('.sw').forEach((s, j) => s.setAttribute('aria-pressed', j === i));
    $('colorName').textContent = COLORS[i][0];
    show();
  }
  function pickSize(name) {
    if (!SIZES[name]) return;
    size = name; buildBed(); badge();
    sizeWrap.querySelectorAll('.size').forEach(s => s.setAttribute('aria-pressed', s.id === 'size-' + name.toLowerCase()));
    show();
  }
  // host page API: iframe.contentWindow.postMessage({ type: 'bamboo', color: 'Navy', size: 'King', action: 'replay' }, '*')
  const tell = event => { if (window.parent !== window) window.parent.postMessage({ type: 'bamboo', event, color: COLORS[chosen][0], size, t }, '*'); };
  window.addEventListener('message', e => {
    const m = e.data;
    if (!m || m.type !== 'bamboo') return;
    if (m.color) pickColor(findColor(m.color));
    if (m.format) pickFormat(String(m.format).toLowerCase());
    if (m.size) pickSize(m.size.charAt(0).toUpperCase() + m.size.slice(1).toLowerCase());
    if (m.action === 'replay') { t = 0; playing = true; last = null; }
    if (m.action === 'pause') playing = false;
    if (m.action === 'play') { if (t >= DUR) t = 0; playing = true; last = null; }
    if (m.action === 'finish') { t = 29.9; playing = false; }
    if (typeof m.seek === 'number') { t = clamp(m.seek, 0, DUR); playing = false; }
    show();
  });

  const fmtWrap = $('formats');
  function pickFormat(f) {
    if (!FMT[f]) return;
    format = f; buildBed();
    fmtWrap.querySelectorAll('.size').forEach(b => b.setAttribute('aria-pressed', b.id === 'fmt-' + f));
    show();
  }
  fmtWrap.querySelectorAll('.size').forEach(b => {
    b.setAttribute('aria-pressed', b.id === 'fmt-' + format);
    b.addEventListener('click', () => pickFormat(b.id.slice(4)));
  });

  if (embed) document.body.classList.add('embed');
  if (capture) { document.body.classList.add('capture'); playing = false; }
  if (reduce && !capture) { playing = false; t = 29.9; }

  $('colorName').textContent = COLORS[chosen][0];
  swWrap.querySelectorAll('.sw').forEach((s, j) => s.setAttribute('aria-pressed', j === chosen));
  sizeWrap.querySelectorAll('.size').forEach(s => s.setAttribute('aria-pressed', s.id === 'size-' + size.toLowerCase()));
  buildBed();
  function badge() {
    const w = $('sizeBadgeText').getComputedTextLength() + 56, V = format === 'vertical';
    const x = V ? 540 - w / 2 : 56, y = V ? 488 : 48;
    set('sizeBadgeBox', { x, y, width: w });
    set('sizeBadgeText', { x: x + 28, y: y + 34 });
  }
  badge();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layoutFormat(); show(); });

  window.__seek = s => { t = s; render(s); };
  window.__setColor = name => { chosen = COLORS.findIndex(c => c[0] === name); painted = null; };
  window.__setSize = name => { size = name; buildBed(); };
  window.__setFormat = f => { format = f; buildBed(); };
  show();
  tell('ready');
  if (!capture) requestAnimationFrame(tick);
})();
</script>
